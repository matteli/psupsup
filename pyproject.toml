[project]
name = "psupsup"
version = "26.0.0"
description = "Psupsup est une librairie de traitement des données des candidats à l'admission post-bac en France, permettant de générer des fichiers Excel, CSV et PDF à partir des résultats traités des candidats."
authors = [
    {name = "Matthieu Nué",email = "matthieu.nue@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openpyxl (>=3.1.5,<4.0.0)",
    "fpdf (>=1.7.2,<2.0.0)"
]

[tool.poetry]
packages = [{include = "psupsup", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
